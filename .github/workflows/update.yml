name: Update Nuvio IPA

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get latest Nuvio release and repository stats
        id: release
        run: |
          API="https://api.github.com/repos/NuvioMedia/NuvioMobile"
          RELEASE=$(curl -fsSL "$API/releases/latest")
          REPO=$(curl -fsSL "$API")

          VERSION=$(echo "$RELEASE" | jq -r '.tag_name')
          DATE=$(echo "$RELEASE" | jq -r '.published_at')
          NOTES=$(echo "$RELEASE" | jq -r '.body // "No release notes provided."')

          IPA=$(echo "$RELEASE" | jq -c '[.assets[] | select(.name | endswith(".ipa"))][0]')
          URL=$(echo "$IPA" | jq -r '.browser_download_url')
          SIZE=$(echo "$IPA" | jq -r '.size')
          SHA=$(echo "$IPA" | jq -r '.digest // "" | sub("^sha256:"; "")')

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "No IPA found in the latest release."
            exit 1
          fi

          STARS=$(echo "$REPO" | jq -r '.stargazers_count')
          TOTAL_OPEN=$(echo "$REPO" | jq -r '.open_issues_count')

          PRS=$(curl -fsSL "$API/pulls?state=open&per_page=100" | jq 'length')
          ISSUE_COUNT=$((TOTAL_OPEN - PRS))

          COMMITS=$(curl -fsSI -H "Accept: application/vnd.github+json" "$API/commits?per_page=1" | grep -i '^link:' | grep -o 'page=[0-9]*>; rel="last"' | tail -1 | grep -o '[0-9]*' || true)
          if [ -z "$COMMITS" ]; then
            COMMITS=$(curl -fsSL "$API/commits?per_page=1" | jq 'length')
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "stars=$STARS" >> "$GITHUB_OUTPUT"
          echo "commits=$COMMITS" >> "$GITHUB_OUTPUT"
          echo "issues=$ISSUE_COUNT" >> "$GITHUB_OUTPUT"
          echo "prs=$PRS" >> "$GITHUB_OUTPUT"

          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update source
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DATE: ${{ steps.release.outputs.date }}
          URL: ${{ steps.release.outputs.url }}
          SIZE: ${{ steps.release.outputs.size }}
          SHA: ${{ steps.release.outputs.sha }}
          STARS: ${{ steps.release.outputs.stars }}
          COMMITS: ${{ steps.release.outputs.commits }}
          ISSUES: ${{ steps.release.outputs.issues }}
          PRS: ${{ steps.release.outputs.prs }}
          NOTES: ${{ steps.release.outputs.notes }}
        run: |
          printf '%s\n' \
            'Nuvio .ipa source, automatically updated from the official repository.' \
            'https://github.com/NuvioMedia/NuvioMobile' \
            "⭐ $STARS stars · 💻 $COMMITS commits" \
            "🐛 $ISSUES open issues · 🔀 $PRS open pull requests" \
            '' \
            'View this SideStore source on GitHub' \
            'https://github.com/alexandrmartins/nuvio-ipa-source' \
            'Add this source to SideStore' \
            'https://raw.githubusercontent.com/alexandrmartins/nuvio-ipa-source/main/source.json' \
            > description.txt

          jq --rawfile description description.txt \
            '.description = ($description | rtrimstr("\n"))' \
            source.json > source.tmp
          mv source.tmp source.json

          if jq -e --arg version "$VERSION" '.apps[0].versions[] | select(.version == $version)' source.json > /dev/null; then
            echo "Version $VERSION already exists; repository stats were updated only."
            exit 0
          fi

          jq \
            --arg version "$VERSION" \
            --arg date "$DATE" \
            --arg url "$URL" \
            --arg notes "$NOTES" \
            --arg sha "$SHA" \
            --argjson size "$SIZE" \
            '.apps[0].versions |=
              [{
                version: $version,
                date: $date,
                localizedDescription: $notes,
                downloadURL: $url,
                size: $size,
                sha256: $sha,
                minOSVersion: "16.1"
              }] + .' \
            source.json > source.tmp

          mv source.tmp source.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add source.json

          if git diff --cached --quiet; then
            echo "No update available."
          else
            git commit -m "Update Nuvio source"
            git push
          fi

# The schedule intentionally runs every 30 minutes.
