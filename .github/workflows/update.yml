name: Update Nuvio IPA

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest Nuvio release
        id: release
        run: |
          RELEASE=$(curl -fsSL https://api.github.com/repos/NuvioMedia/NuvioMobile/releases/latest)

          VERSION=$(echo "$RELEASE" | jq -r '.tag_name')
          DATE=$(echo "$RELEASE" | jq -r '.published_at | split("T")[0]')

          IPA=$(echo "$RELEASE" | jq -c '.assets[] | select(.name | endswith(".ipa"))')
          URL=$(echo "$IPA" | jq -r '.browser_download_url')
          SIZE=$(echo "$IPA" | jq -r '.size')

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Update source.json
        run: |
          jq \
            --arg version "${{ steps.release.outputs.version }}" \
            --arg date "${{ steps.release.outputs.date }}" \
            --arg url "${{ steps.release.outputs.url }}" \
            --argjson size "${{ steps.release.outputs.size }}" \
            '.apps[0].version = $version |
             .apps[0].versionDate = $date |
             .apps[0].downloadURL = $url |
             .apps[0].size = $size' \
            source.json > source.tmp

          mv source.tmp source.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add source.json

          if git diff --cached --quiet; then
            echo "No update available."
          else
            git commit -m "Update Nuvio to ${{ steps.release.outputs.version }}"
            git push
          fi
