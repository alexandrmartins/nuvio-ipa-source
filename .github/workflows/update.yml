name: Update Nuvio IPA

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest Nuvio release
        id: release
        run: |
          RELEASE=$(curl -fsSL https://api.github.com/repos/NuvioMedia/NuvioMobile/releases/latest)

          VERSION=$(echo "$RELEASE" | jq -r '.tag_name')
          DATE=$(echo "$RELEASE" | jq -r '.published_at')
          NOTES=$(echo "$RELEASE" | jq -r '.body // "No release notes provided."')

          IPA=$(echo "$RELEASE" | jq -c '[.assets[] | select(.name | endswith(".ipa"))][0]')
          URL=$(echo "$IPA" | jq -r '.browser_download_url')
          SIZE=$(echo "$IPA" | jq -r '.size')
          SHA=$(echo "$IPA" | jq -r '.digest // "" | sub("^sha256:"; "")')

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "No IPA found in the latest release."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Add new version to source
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DATE: ${{ steps.release.outputs.date }}
          URL: ${{ steps.release.outputs.url }}
          SIZE: ${{ steps.release.outputs.size }}
          SHA: ${{ steps.release.outputs.sha }}
          NOTES: ${{ steps.release.outputs.notes }}
        run: |
          if jq -e --arg version "$VERSION" '.apps[0].versions[] | select(.version == $version)' source.json > /dev/null; then
            echo "Version $VERSION already exists in source.json."
            exit 0
          fi

          jq \
            --arg version "$VERSION" \
            --arg date "$DATE" \
            --arg url "$URL" \
            --arg notes "$NOTES" \
            --arg sha "$SHA" \
            --argjson size "$SIZE" \
            '.apps[0].versions |=
              [{
                version: $version,
                date: $date,
                localizedDescription: $notes,
                downloadURL: $url,
                size: $size,
                sha256: $sha,
                minOSVersion: "16.1"
              }] + .' \
            source.json > source.tmp

          mv source.tmp source.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add source.json

          if git diff --cached --quiet; then
            echo "No update available."
          else
            git commit -m "Update Nuvio to ${{ steps.release.outputs.version }}"
            git push
          fi
