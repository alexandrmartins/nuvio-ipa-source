name: Update Nuvio IPA

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Get latest Nuvio release and repository stats
        id: release
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/NuvioMedia/NuvioMobile"
          AUTH_HEADER=( -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" )

          RELEASE=$(curl -fsSL "${AUTH_HEADER[@]}" "$API/releases/latest")
          REPO=$(curl -fsSL "${AUTH_HEADER[@]}" "$API")

          VERSION=$(jq -er '.tag_name' <<<"$RELEASE")
          DATE=$(jq -er '.published_at' <<<"$RELEASE")
          NOTES=$(jq -r '.body // "No release notes provided."' <<<"$RELEASE")

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::Failed to fetch release version."
            exit 1
          fi

          if [ -z "$DATE" ] || [ "$DATE" = "null" ]; then
            echo "::error::Failed to fetch release date."
            exit 1
          fi

          IPA=$(jq -c '[.assets[] | select(.name | endswith(".ipa"))][0]' <<<"$RELEASE")

          if [ "$IPA" = "null" ] || [ -z "$IPA" ]; then
            echo "::error::No IPA found in the latest Nuvio release ($VERSION)."
            exit 1
          fi

          URL=$(jq -er '.browser_download_url' <<<"$IPA")
          SIZE=$(jq -er '.size' <<<"$IPA")
          SHA=$(jq -r '.digest // "" | sub("^sha256:"; "")' <<<"$IPA")

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "::error::IPA download URL is missing for release $VERSION."
            exit 1
          fi

          if [ -z "$SIZE" ] || [ "$SIZE" = "null" ]; then
            echo "::error::IPA size is missing for release $VERSION."
            exit 1
          fi

          STARS=$(jq -er '.stargazers_count' <<<"$REPO")
          TOTAL_OPEN=$(jq -er '.open_issues_count' <<<"$REPO")

          PRS=$(curl -fsSL "${AUTH_HEADER[@]}" "$API/pulls?state=open&per_page=100" | jq 'length')
          ISSUE_COUNT=$((TOTAL_OPEN - PRS))

          COMMITS=$(curl -fsSI "${AUTH_HEADER[@]}" "$API/commits?per_page=1" \
            | tr -d '\r' \
            | grep -i '^link:' \
            | grep -o 'page=[0-9]*>; rel="last"' \
            | tail -1 \
            | grep -o '[0-9]*' || true)
          if [ -z "$COMMITS" ]; then
            COMMITS=$(curl -fsSL "${AUTH_HEADER[@]}" "$API/commits?per_page=100" | jq 'length')
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "stars=$STARS" >> "$GITHUB_OUTPUT"
          echo "commits=$COMMITS" >> "$GITHUB_OUTPUT"
          echo "issues=$ISSUE_COUNT" >> "$GITHUB_OUTPUT"
          echo "prs=$PRS" >> "$GITHUB_OUTPUT"

          {
            echo 'notes<<EOF'
            echo "$NOTES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail

          test -f source.json || { echo "::error::source.json does not exist."; exit 1; }
          jq -e '.apps | type == "array" and length > 0' source.json >/dev/null || {
            echo "::error::source.json has an invalid apps structure."
            exit 1
          }
          jq -e '.apps[0].bundleIdentifier and (.apps[0].versions | type == "array")' source.json >/dev/null || {
            echo "::error::source.json has an invalid app/version structure."
            exit 1
          }

      - name: Update source
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DATE: ${{ steps.release.outputs.date }}
          URL: ${{ steps.release.outputs.url }}
          SIZE: ${{ steps.release.outputs.size }}
          SHA: ${{ steps.release.outputs.sha }}
          STARS: ${{ steps.release.outputs.stars }}
          COMMITS: ${{ steps.release.outputs.commits }}
          ISSUES: ${{ steps.release.outputs.issues }}
          PRS: ${{ steps.release.outputs.prs }}
          NOTES: ${{ steps.release.outputs.notes }}
        shell: bash
        run: |
          set -euo pipefail

          printf '%s\n' \
            'Nuvio .ipa source, automatically updated from the official repository.' \
            'https://github.com/NuvioMedia/NuvioMobile' \
            "⭐ $STARS stars · 💻 $COMMITS commits" \
            "🐛 $ISSUES open issues · 🔀 $PRS open pull requests" \
            '' \
            'View this SideStore source on GitHub' \
            'https://github.com/alexandrmartins/nuvio-ipa-source' \
            'Add this source to SideStore' \
            'https://raw.githubusercontent.com/alexandrmartins/nuvio-ipa-source/main/source.json' \
            > description.txt

          jq --rawfile description description.txt \
            '.description = ($description | rtrimstr("\n"))' \
            source.json > source.tmp
          mv source.tmp source.json

          if jq -e --arg version "$VERSION" '.apps[0].versions[] | select(.version == $version)' source.json > /dev/null; then
            echo "::notice::Version $VERSION already exists; repository statistics updated only."
            exit 0
          fi

          jq \
            --arg version "$VERSION" \
            --arg date "$DATE" \
            --arg url "$URL" \
            --arg notes "$NOTES" \
            --arg sha "$SHA" \
            --argjson size "$SIZE" \
            '.apps[0].versions |=
              [{
                version: $version,
                date: $date,
                localizedDescription: $notes,
                downloadURL: $url,
                size: $size,
                sha256: $sha,
                minOSVersion: "16.1"
              }] + .' \
            source.json > source.tmp

          mv source.tmp source.json

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add source.json

          if git diff --cached --quiet; then
            echo "No update available."
          else
            git commit -m "Update Nuvio source"
            git push
          fi
